name: Deploy to Hetzner

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set lowercase image name
        run: echo "IMAGE=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]'):latest" >> $GITHUB_ENV

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}

      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Deploy on server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HETZNER_TS_IP }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          script: |
            set -euo pipefail
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker image prune -f || true
            docker pull ${{ env.IMAGE }}
            docker stop visdomsatlasen || true
            docker rm visdomsatlasen || true
            docker run -d \
              --name visdomsatlasen \
              --restart unless-stopped \
              --add-host=host.docker.internal:host-gateway \
              -p 3001:8080 \
              -v /opt/visdomsatlasen/data:/app/data \
              --env-file /opt/visdomsatlasen/.env \
              -e GIT_SHA=${{ github.sha }} \
              ${{ env.IMAGE }}
            # Send the atlas bundle to Hackytel's E Ink tablet. Wait for the server to
            # answer (robots.txt passes the access gate), then call the export with the
            # ingest token. A failure here is logged and never stops the deploy.
            for i in $(seq 1 60); do
              curl -s -o /dev/null http://127.0.0.1:3001/robots.txt && break
              sleep 1
            done
            TOKEN=$(grep -E '^(INGEST_TOKEN|UPDATE_TOKEN)=' /opt/visdomsatlasen/.env | head -1 | cut -d= -f2- || true)
            curl -fsS -X POST http://127.0.0.1:3001/api/export/hackytel \
              -H "Authorization: Bearer $TOKEN" || echo "atlas export failed, deploy continues"
